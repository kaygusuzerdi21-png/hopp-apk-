name: Imza Anahtari Uret (tek seferlik)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Anahtar uret
        run: |
          keytool -genkeypair -v \
            -keystore upload.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hopp2026 -keypass hopp2026 \
            -dname "CN=hopp, OU=hopp, O=hopp, L=Istanbul, S=Istanbul, C=TR"
          echo "================ KEYSTORE BASE64 ================"
          base64 -w0 upload.jks
          echo ""
          echo "================ BITTI ================"
      - name: Keystore'u artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload.jks
