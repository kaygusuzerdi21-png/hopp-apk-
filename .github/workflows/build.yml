name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: create-android
        run: flutter create --platforms=android --org com.hopp.app --project-name hopp .

      - name: set-package-and-sdk
        run: |
          GR=android/app/build.gradle.kts
          sed -i -E 's/applicationId = "[^"]*"/applicationId = "com.hopp.dating"/' "$GR"
          sed -i -E 's/compileSdk = [A-Za-z0-9._]+/compileSdk = 36/' "$GR"
          sed -i -E 's/targetSdk = [A-Za-z0-9._]+/targetSdk = 36/' "$GR"
          grep -E "applicationId|compileSdk|targetSdk" "$GR" || true

      - name: setup-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storePassword=hopp2026\nkeyPassword=hopp2026\nkeyAlias=upload\nstoreFile=upload.jks\n' > android/key.properties
          GR=android/app/build.gradle.kts
          sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' "$GR"
          sed -i '0,/android {/s##val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }\n\nandroid {\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }##' "$GR"
          sed -i -E 's/signingConfig *= *signingConfigs\.getByName\("debug"\)/signingConfig = signingConfigs.getByName("release")/' "$GR"
          cat "$GR"

      - name: add-permissions
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          sed -i "s#<application#${PERMS}<application#" "$MAN"
          ADMOB='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3092168413729990~6832555121"/>'
          sed -i "s#</application>#${ADMOB}</application>#" "$MAN"
          cat "$MAN"

      - name: pub-get
        run: flutter pub get

      - name: launcher-icon
        continue-on-error: true
        run: dart run flutter_launcher_icons || echo "icon skipped"

      - name: version-code
        id: vercode
        run: echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: build-apk
        run: flutter build apk --release --build-number=${{ steps.vercode.outputs.code }}

      - name: build-aab
        run: flutter build appbundle --release --build-number=${{ steps.vercode.outputs.code }}

      - name: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: hopp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: upload-aab
        uses: actions/upload-artifact@v4
        with:
          name: hopp-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
