name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.hopp.app --project-name hopp .

      - name: Izinleri ekle
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          sed -i "s#<application#${PERMS}<application#" "$MAN"
          cat "$MAN"

      - name: Ikonu hazirla (senin resminden)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets/icon
          if [ -f hopp.png ]; then SRC=hopp.png; elif [ -f assets/icon/hopp.png ]; then SRC=assets/icon/hopp.png; else echo "HATA: hopp.png bulunamadi"; exit 1; fi
          echo "Kaynak icon: $SRC"
          convert "$SRC" -resize 1024x1024^ -gravity center -extent 1024x1024 -alpha off -fuzz 14% -fill '#1883fd' -draw 'color 1,1 floodfill' -draw 'color 1022,1 floodfill' -draw 'color 1,1022 floodfill' -draw 'color 1022,1022 floodfill' assets/icon/hopp.png
          convert assets/icon/hopp.png -resize 66% -background '#1883fd' -gravity center -extent 1024x1024 assets/icon/hopp_foreground.png
          ls -la assets/icon

      - name: pubspec ikon ayari
        run: |
          grep -q "^flutter_launcher_icons:" pubspec.yaml || printf '\nflutter_launcher_icons:\n  android: "ic_launcher"\n  min_sdk_android: 21\n  image_path: "assets/icon/hopp.png"\n  adaptive_icon_background: "#1883fd"\n  adaptive_icon_foreground: "assets/icon/hopp_foreground.png"\n' >> pubspec.yaml
          grep -q "flutter_launcher_icons: \^" pubspec.yaml || sed -i 's#^dev_dependencies:#dev_dependencies:\n  flutter_launcher_icons: ^0.14.1#' pubspec.yaml
          cat pubspec.yaml

      - name: Paketleri al
        run: flutter pub get

      - name: Ikonu olustur
        run: dart run flutter_launcher_icons

      - name: APK derle
        run: flutter build apk --release

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: hopp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
