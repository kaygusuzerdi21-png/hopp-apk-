name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.hopp.app .

      - name: Izinleri ekle
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's|\n    \n    \n    \n    \n    \n    
    
