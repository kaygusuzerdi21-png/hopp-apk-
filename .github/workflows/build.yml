name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.hopp.app --project-name hopp .

      - name: Izinleri ekle
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          sed -i "s#<application#${PERMS}<application#" "$MAN"
          # AdMob App ID (hopp gercek)
          ADMOB='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3092168413729990~6832555121"/>'
          sed -i "s#</application>#${ADMOB}</application>#" "$MAN"
          cat "$MAN"

      - name: Paketleri al
        run: flutter pub get

      - name: Uygulama ikonunu uret
        run: dart run flutter_launcher_icons

      - name: APK derle
        run: flutter build apk --release

      - name: AAB derle (Play Store icin)
        run: flutter build appbundle --release

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: hopp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: hopp-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
