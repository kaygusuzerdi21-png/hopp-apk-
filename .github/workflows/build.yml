name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.hopp.app --project-name hopp .

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "HATA: KEYSTORE_BASE64 secret yok."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storePassword=hopp2026\nkeyPassword=hopp2026\nkeyAlias=upload\nstoreFile=upload.jks\n' > android/key.properties
          GR=android/app/build.gradle
          sed -i '0,/android {/s##def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\nandroid {\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n            storePassword keystoreProperties["storePassword"]\n        }\n    }##' "$GR"
          sed -i -E 's/signingConfig *=? *signingConfigs\.debug/signingConfig signingConfigs.release/' "$GR"

          echo "----- build.gradle -----"; cat "$GR"

      - name: Izinleri ekle
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          sed -i "s#<application#${PERMS}<application#" "$MAN"
          ADMOB='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3092168413729990~6832555121"/>'
          sed -i "s#</application>#${ADMOB}</application>#" "$MAN"
          cat "$MAN"

      - name: Paketleri al
        run: flutter pub get

      - name: Uygulama ikonunu uret
        continue-on-error: true
        run: dart run flutter_launcher_icons || echo "ikon atlandi"

      - name: APK derle
        run: flutter build apk --release

      - name: AAB derle (Play Store icin)
        run: flutter build appbundle --release

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: hopp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: hopp-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
