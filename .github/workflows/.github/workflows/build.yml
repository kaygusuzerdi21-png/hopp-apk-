İşte kolay yol dostum ⬆️ — bu yeni build.yml ile hiç resim yüklemen gerekmeyecek. İkonu (mavi zemin + beyaz "hopp") GitHub sunucusu otomatik üretecek.

🎯 Tek yapman gereken: 1 dosyayı değiştir
GitHub'da reponda .github/workflows/build.yml dosyasını bu yenisiyle değiştir:

GitHub'da repona git → .github klasörü → workflows → build.yml'a tıkla
Sağ üstte kalem (✏️ Edit) ikonu
İçindeki her şeyi sil
İndirdiğin build.yml'ı bir not uygulamasında aç → tümünü kopyala → buraya yapıştır
Alttan Commit changes (yeşil buton)
🧹 Bir de şu bozuk dosyayı sil
Repoda yanlış yere yüklenmiş bir dosya var: .github/workflows/.github/workflows/build.yml

O dosyaya git → kalem yanındaki 🗑️ çöp kutusu → Commit (silmek için)
(Bulamazsan dert etme, build yine çalışır)
✅ Sonrası otomatik
Commit'leyince:

Actions sekmesi → yeni build başlar (sarı nokta)
~5 dk sonra yeşil ✓
Build'e tıkla → aşağıda Artifacts → hopp-apk indir
APK'yı kur → ikon artık mavi "hopp" 🎉
Bu yöntem neden daha kolay: artık ne resim yüklüyorsun, ne pubspec değiştiriyorsun — workflow her şeyi (ikon üretme + pubspec ayarı + build) kendisi yapıyor. Sadece bu tek dosyayı doğru yere koyman yeterli.

Commit'leyince Actions'ın yeşil olup olmadığını söyle, takılırsan bakarız 👍

Kopyalancak şekilde ver dosyayı
İşte dostum, kopyalaman için tam metni aşağıya koyuyorum. Sağ üstteki kopyala butonuyla al, GitHub'da .github/workflows/build.yml'ın içine yapıştır:

name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.hopp.app --project-name hopp .

      - name: Izinleri ekle
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          sed -i "s#<application#${PERMS}<application#" "$MAN"
          cat "$MAN"

      - name: Ikon uret (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
          mkdir -p assets/icon
          convert -size 1024x1024 xc:'#1B80FD' \
            -gravity center -font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            -pointsize 360 -fill white -annotate +0-10 'hopp' \
            assets/icon/hopp.png
          convert -size 1024x1024 xc:none \
            -gravity center -font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            -pointsize 250 -fill white -annotate +0-10 'hopp' \
            assets/icon/hopp_foreground.png
          ls -la assets/icon

      - name: pubspec ikon ayari
        run: |
          grep -q "flutter_launcher_icons:" pubspec.yaml || \
            sed -i 's#^dev_dependencies:#dev_dependencies:\n  flutter_launcher_icons: ^0.14.1#' pubspec.yaml
          grep -q "^flutter_launcher_icons:" pubspec.yaml || cat >> pubspec.yaml <<'EOF'

flutter_launcher_icons:
  android: "ic_launcher"
  min_sdk_android: 21
  image_path: "assets/icon/hopp.png"
  adaptive_icon_background: "#1B80FD"
  adaptive_icon_foreground: "assets/icon/hopp_foreground.png"
EOF
          cat pubspec.yaml

      - name: Paketleri al
        run: flutter pub get

      - name: Ikonu olustur
        run: dart run flutter_launcher_icons

      - name: APK derle
        run: flutter build apk --release

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: hopp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
